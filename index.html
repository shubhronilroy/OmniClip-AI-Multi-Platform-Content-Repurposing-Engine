                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Interactive Transcript Stream */}
                <div className="rounded-xl border border-slate-800 bg-slate-900/60 p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-white text-sm">Interactive Transcript</h3>
                    <span className="text-[10px] text-slate-500 font-mono">{filteredTranscript.length} lines</span>
                  </div>
                  <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Search words in transcript..."
                    className="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                  />
                  <div className="space-y-1.5 max-h-[300px] overflow-y-auto pr-1">
                    {filteredTranscript.map(t => (
                      <div
                        key={t.id}
                        onClick={() => handleSeek(t.start)}
                        className={`p-2 rounded-lg text-xs flex items-start gap-2.5 cursor-pointer transition-colors ${
                          currentSeekTime >= t.start && currentSeekTime <= t.end
                            ? "bg-indigo-600/30 border border-indigo-500/50 text-white"
                            : "hover:bg-slate-800/50 text-slate-300"
                        }`}
                      >
                        <span className="font-mono text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-indigo-300 shrink-0">
                          {formatTime(t.start)}
                        </span>
                        <p className="leading-relaxed flex-1 text-[11px]">{t.text}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* RIGHT PANEL: ASSET STUDIO */}
              <div className="lg:col-span-7 rounded-xl border border-slate-800 bg-slate-900/60 p-5 space-y-5">
                {/* Active Nugget Banner & Tab Switcher */}
                <div className="border-b border-slate-800 pb-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="bg-rose-500/20 text-rose-300 border border-rose-500/40 text-[10px] font-bold px-2 py-0.5 rounded">
                          Viral Score {selectedNugget.viralityScore}
                        </span>
                        <h2 className="text-base font-bold text-white">{selectedNugget.title}</h2>
                      </div>
                      <p className="text-xs text-slate-400 mt-0.5">{selectedNugget.summary}</p>
                    </div>

                    <button
                      onClick={() => showToast("Regenerated", "Prompt 2 multi-format assets re-orchestrated.")}
                      className="px-3 py-1.5 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-800 text-xs font-medium text-slate-300"
                    >
                      🔄 Regenerate
                    </button>
                  </div>

                  {/* Platform Tabs */}
                  <div className="flex items-center gap-2 p-1 rounded-xl bg-slate-950 border border-slate-800 text-xs">
                    <button
                      onClick={() => setActiveTab("tiktok")}
                      className={`flex-1 py-2 rounded-lg font-bold transition-all ${
                        activeTab === "tiktok"
                          ? "bg-gradient-to-r from-pink-600 to-rose-600 text-white shadow-lg"
                          : "text-slate-400 hover:text-white"
                      }`}
                    >
                      📱 TikTok / Shorts Script
                    </button>
                    <button
                      onClick={() => setActiveTab("twitter")}
                      className={`flex-1 py-2 rounded-lg font-bold transition-all ${
                        activeTab === "twitter"
                          ? "bg-sky-600 text-white shadow-lg"
                          : "text-slate-400 hover:text-white"
                      }`}
                    >
                      🐦 X (Twitter) Thread
                    </button>
                    <button
                      onClick={() => setActiveTab("linkedin")}
                      className={`flex-1 py-2 rounded-lg font-bold transition-all ${
                        activeTab === "linkedin"
                          ? "bg-blue-600 text-white shadow-lg"
                          : "text-slate-400 hover:text-white"
                      }`}
                    >
                      💼 LinkedIn Carousel
                    </button>
                  </div>
                </div>

                {/* TAB 1: TIKTOK / SHORTS SCRIPT + 9:16 PHONE MOCKUP */}
                {activeTab === "tiktok" && (
                  <div className="flex flex-col lg:flex-row gap-6 items-start">
                    {/* Scene Table */}
                    <div className="flex-1 space-y-3 w-full">
                      <div className="flex items-center justify-between p-3 rounded-lg bg-slate-950 border border-slate-800">
                        <div>
                          <p className="font-bold text-xs text-white">{currentAssets.tiktok.title}</p>
                          <p className="text-[11px] text-slate-400">Audio: {currentAssets.tiktok.suggestedBgm}</p>
                        </div>
                        <button
                          onClick={() => {
                            navigator.clipboard.writeText(JSON.stringify(currentAssets.tiktok, null, 2));
                            showToast("Copied!", "TikTok full production script copied to clipboard.");
                          }}
                          className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200"
                        >
                          📋 Copy Script
                        </button>
                      </div>

                      <div className="space-y-2.5">
                        {currentScenes.map((scene, idx) => (
                          <div
                            key={scene.sceneNumber}
                            onClick={() => setActiveSceneIndex(idx)}
                            className={`p-3 rounded-xl border cursor-pointer transition-all ${
                              idx === activeSceneIndex
                                ? "border-pink-500 bg-pink-950/20 ring-1 ring-pink-500/50"
                                : "border-slate-800 bg-slate-950/50 hover:border-slate-700"
                            }`}
                          >
                            <div className="flex items-center justify-between mb-1.5">
                              <span className="font-mono text-[10px] font-bold bg-pink-500/20 text-pink-300 px-2 py-0.5 rounded border border-pink-500/30">
                                Scene {scene.sceneNumber} ({scene.timeRange})
                              </span>
                              <span className="text-[10px] font-bold text-amber-300 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">
                                {scene.onScreenText}
                              </span>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px]">
                              <div className="p-2 rounded bg-slate-900/60 border border-slate-800/60 text-slate-300 italic">
                                <span className="font-bold text-slate-400 not-italic block text-[9px] uppercase">Visual B-Roll:</span>
                                {scene.visualCues}
                              </div>
                              <div className="p-2 rounded bg-slate-900/60 border border-slate-800/60 text-white font-medium">
                                <span className="font-bold text-pink-400 block text-[9px] uppercase">Spoken Audio:</span>
                                "{scene.spokenAudio}"
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 9:16 Phone Mockup */}
                    <div className="w-full lg:w-[280px] shrink-0 flex flex-col items-center">
                      <p className="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">9:16 Live Preview</p>
                      <div className="relative w-[260px] h-[520px] rounded-[36px] bg-black border-[6px] border-slate-800 shadow-2xl overflow-hidden flex flex-col justify-between">
                        {/* Notch */}
                        <div className="absolute top-2 inset-x-0 mx-auto w-20 h-4 bg-slate-900 rounded-full z-30"></div>
                        {/* Status */}
                        <div className="relative z-20 pt-2 px-5 flex justify-between text-[9px] text-white font-semibold">
                          <span>9:41</span>
                          <span>5G 100%</span>
                        </div>
                        {/* Center Animated Caption */}
                        <div className="relative z-20 px-3 my-auto text-center space-y-2">
                          <span className="inline-block px-2 py-0.5 bg-amber-400 text-black text-[10px] font-black uppercase rounded shadow">
                            {currentScene.onScreenText}
                          </span>
                          <div className="bg-black/70 p-2.5 rounded-lg border border-white/20">
                            <p className="text-white text-[11px] font-bold">"{currentScene.spokenAudio}"</p>
                          </div>
                        </div>
                        {/* Right Actions */}
                        <div className="absolute right-2 bottom-20 z-20 flex flex-col items-center gap-3 text-white text-[9px]">
                          <span className="text-rose-500 font-bold text-sm">♥</span>
                          <span>42.8K</span>
                          <span className="text-sm">💬</span>
                          <span>1.1K</span>
                          <span className="text-sm">↗</span>
                          <span>5.4K</span>
                        </div>
                        {/* Bottom Metadata */}
                        <div className="relative z-20 p-3 bg-gradient-to-t from-black to-transparent text-white text-[10px]">
                          <p className="font-bold">@omniclip.creator</p>
                          <p className="text-slate-300 text-[9px] truncate">{currentAssets.tiktok.title}</p>
                        </div>
                      </div>
                      <button
                        onClick={() => setIsPhonePlaying(!isPhonePlaying)}
                        className="mt-2 text-xs text-slate-400 hover:text-white"
                      >
                        {isPhonePlaying ? "⏸ Pause Phone Simulation" : "▶ Resume Phone Simulation"}
                      </button>
                    </div>
                  </div>
                )}

                {/* TAB 2: X (TWITTER) THREAD */}
                {activeTab === "twitter" && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between p-3 rounded-lg bg-slate-950 border border-slate-800">
                      <div>
                        <p className="font-bold text-xs text-white">{currentAssets.twitter.title}</p>
                        <p className="text-[11px] text-slate-400">{currentAssets.twitter.totalTweets} Tweets • Strict 280-char Check</p>
                      </div>
                      <button
                        onClick={() => {
                          const full = currentAssets.twitter.tweets.map(t => t.content).join("\n\n---\n\n");
                          navigator.clipboard.writeText(full);
                          showToast("Thread Copied!", "All 5 tweets copied formatted for X.");
                        }}
                        className="px-3 py-1.5 rounded bg-sky-600 hover:bg-sky-500 text-xs font-semibold text-white shadow"
                      >
                        📋 Copy Full Thread
                      </button>
                    </div>

                    <div className="space-y-3">
                      {currentAssets.twitter.tweets.map((t, idx) => (
                        <div key={idx} className="p-4 rounded-xl border border-slate-800 bg-slate-950/70 space-y-2">
                          <div className="flex items-center justify-between text-xs">
                            <div className="flex items-center gap-2">
                              <span className="w-7 h-7 rounded-full bg-sky-500 text-white font-bold flex items-center justify-center text-[10px]">
                                OC
                              </span>
                              <div>
                                <span className="font-bold text-white">OmniClip AI</span>
                                <span className="text-slate-500 text-[10px] ml-1">@omniclip_ai</span>
                              </div>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className="font-mono text-[10px] bg-slate-800 px-2 py-0.5 rounded text-emerald-400 font-semibold">
                                {t.charCount}/280 chars
                              </span>
                              <button
                                onClick={() => {
                                  navigator.clipboard.writeText(t.content);
                                  showToast(`Tweet ${t.tweetNumber} Copied`, "Ready to post on X.");
                                }}
                                className="text-slate-400 hover:text-white text-xs px-2 py-0.5 bg-slate-900 rounded border border-slate-800"
                              >
                                Copy
                              </button>
                            </div>
                          </div>
                          <p className="text-xs sm:text-sm text-slate-200 whitespace-pre-line leading-relaxed">{t.content}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 3: LINKEDIN CAROUSEL */}
                {activeTab === "linkedin" && (
                  <div className="space-y-4">
                    {/* Theme Bar */}
                    <div className="flex flex-wrap items-center justify-between gap-3 p-3 rounded-lg bg-slate-950 border border-slate-800">
                      <div className="flex items-center gap-1.5 text-xs">
                        <span className="text-slate-400 font-medium">Theme:</span>
                        {["midnight", "minimal", "obsidian", "sunset"].map(th => (
                          <button
                            key={th}
                            onClick={() => setTheme(th)}
                            className={`px-2.5 py-1 rounded capitalize text-xs font-semibold transition-all ${
                              theme === th ? "bg-indigo-600 text-white" : "bg-slate-900 text-slate-400 hover:text-white"
                            }`}
                          >
                            {th}
                          </button>
                        ))}
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => {
                            navigator.clipboard.writeText(JSON.stringify(currentAssets.linkedin, null, 2));
                            showToast("Carousel JSON Copied", "Ready for Figma or Canva import.");
                          }}
                          className="px-2.5 py-1 rounded bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-300"
                        >
                          Copy JSON
                        </button>
                        <button
                          onClick={() => {
                            navigator.clipboard.writeText(currentAssets.linkedin.postCaption);
                            showToast("Caption Copied", "LinkedIn post caption copied to clipboard.");
                          }}
                          className="px-2.5 py-1 rounded bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white shadow"
                        >
                          Copy Caption
                        </button>
                      </div>
                    </div>

                    {/* Interactive Slide Viewer */}
                    <div className="flex items-center justify-center gap-4">
                      <button
                        onClick={() => setSlideIndex(prev => prev > 0 ? prev - 1 : slides.length - 1)}
                        className="w-10 h-10 rounded-full bg-slate-900 border border-slate-700 hover:bg-slate-800 flex items-center justify-center text-white font-bold"
                      >
                        ◀
                      </button>

                      {/* Square Slide Frame */}
                      <div className={`w-full max-w-md aspect-square rounded-2xl p-6 flex flex-col justify-between border transition-all ${themeConfig.bg}`}>
                        <div className="flex items-center justify-between">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase border ${themeConfig.tag}`}>
                            {currentSlide.tag}
                          </span>
                          <span className="text-xs font-mono font-bold opacity-70">
                            {currentSlide.slideNumber} / {currentSlide.totalSlides}
                          </span>
                        </div>

                        <div className="my-auto space-y-3">
                          <h4 className={`text-xl leading-tight ${themeConfig.title}`}>{currentSlide.title}</h4>
                          {currentSlide.subtitle && <p className={`text-xs ${themeConfig.sub}`}>{currentSlide.subtitle}</p>}
                          {currentSlide.bullets && (
                            <ul className="space-y-1.5 text-xs">
                              {currentSlide.bullets.map((b, i) => (
                                <li key={i} className="flex items-start gap-2">
                                  <span className={`w-1.5 h-1.5 rounded-full shrink-0 mt-1.5 ${themeConfig.dot}`}></span>
                                  <span>{b}</span>
                                </li>
                              ))}
                            </ul>
                          )}
                          {currentSlide.quote && (
                            <div className={`p-2.5 rounded-lg border text-xs italic ${themeConfig.quote}`}>
                              "{currentSlide.quote}"
                            </div>
                          )}
                        </div>

                        <div className="flex items-center justify-between pt-2 border-t border-current/10 text-[10px]">
                          <span className="font-bold opacity-80">OmniClip Insights</span>
                          <span className="font-bold">{currentSlide.footerCallout}</span>
                        </div>
                      </div>

                      <button
                        onClick={() => setSlideIndex(prev => prev < slides.length - 1 ? prev + 1 : 0)}
                        className="w-10 h-10 rounded-full bg-slate-900 border border-slate-700 hover:bg-slate-800 flex items-center justify-center text-white font-bold"
                      >
                        ▶
                      </button>
                    </div>

                    {/* Dots */}
                    <div className="flex items-center justify-center gap-1.5">
                      {slides.map((_, i) => (
                        <button
                          key={i}
                          onClick={() => setSlideIndex(i)}
                          className={`h-1.5 rounded-full transition-all ${
                            i === slideIndex ? "w-6 bg-indigo-500" : "w-2 bg-slate-700"
                          }`}
                        />
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </main>

          {/* EXPORT MODAL */}
          {isExportOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="w-full max-w-lg bg-slate-950 border border-slate-800 rounded-2xl p-6 space-y-5 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-base">Export & Schedule Multi-Platform</h3>
                  <button onClick={() => setIsExportOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <p className="font-semibold text-slate-300">1. Target Destinations:</p>
                  <div className="grid grid-cols-2 gap-2">
                    <label className="p-2.5 rounded-lg border border-pink-500/40 bg-pink-950/20 flex items-center justify-between cursor-pointer">
                      <span>📱 TikTok Video</span>
                      <input type="checkbox" defaultChecked />
                    </label>
                    <label className="p-2.5 rounded-lg border border-red-500/40 bg-red-950/20 flex items-center justify-between cursor-pointer">
                      <span>▶ YouTube Shorts</span>
                      <input type="checkbox" defaultChecked />
                    </label>
                    <label className="p-2.5 rounded-lg border border-sky-500/40 bg-sky-950/20 flex items-center justify-between cursor-pointer">
                      <span>🐦 X (Twitter)</span>
                      <input type="checkbox" defaultChecked />
                    </label>
                    <label className="p-2.5 rounded-lg border border-blue-500/40 bg-blue-950/20 flex items-center justify-between cursor-pointer">
                      <span>💼 LinkedIn</span>
                      <input type="checkbox" defaultChecked />
                    </label>
                  </div>

                  <p className="font-semibold text-slate-300 pt-2">2. Scheduling Dispatcher:</p>
                  <div className="flex gap-2">
                    <button className="flex-1 py-2 rounded-lg bg-indigo-950/60 border border-indigo-500 text-indigo-300 font-bold">
                      Buffer Webhook
                    </button>
                    <button className="flex-1 py-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-400">
                      Hootsuite Queue
                    </button>
                  </div>

                  <p className="font-semibold text-slate-300 pt-2">3. Timing:</p>
                  <input
                    type="datetime-local"
                    defaultValue="2026-11-09T09:00"
                    className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white"
                  />
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setIsExportOpen(false)}
                    className="px-4 py-2 rounded-lg bg-slate-900 text-slate-300 text-xs"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      setIsExportOpen(false);
                      showToast("🚀 Successfully Queued via Buffer!", "4 platform formats scheduled for Nov 9 at 9:00 AM. Webhook 200 OK.");
                    }}
                    className="px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-bold text-xs"
                  >
                    Confirm & Schedule Across 4 Platforms
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* API KEY MODAL */}
          {isApiModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-950 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-base">API Key Configuration</h3>
                  <button onClick={() => setIsApiModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Groq API Key (llama-3.1-8b-instant-mini)</label>
                    <input type="password" placeholder="sk-proj-..." className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white font-mono" />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Anthropic API Key (Claude 3.5 Sonnet)</label>
                    <input type="password" placeholder="sk-ant-..." className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white font-mono" />
                  </div>
                  <div className="p-3 bg-slate-900 rounded-lg border border-slate-800 text-[11px] text-slate-400">
                    <span className="text-emerald-400 font-bold block mb-0.5">✓ Instant Mock Engine Active</span>
                    If no API key is provided, OmniClip automatically runs with pre-computed high-fidelity keynote clips and virality models.
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                  <button onClick={() => setIsApiModalOpen(false)} className="px-4 py-2 rounded-lg bg-slate-900 text-slate-300 text-xs">Close</button>
                  <button onClick={() => { setIsApiModalOpen(false); showToast("Saved", "API Keys saved to current session."); }} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold">Save Settings</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
